[package]
name = "hotwire-oscilloscope"
version = "1.0.0"
edition = "2021"
description = "HotWire Oscilloscope — Multi-Channel 12-bit GDMA ADC Oscilloscope & FFT Spectrum Analyzer in Rust/WASM (Leptos) for Seeed Studio XIAO ESP32-S3 & ESP32-C6"
license = "Apache-2.0"

[dependencies]
hotwire-core = { git = "https://github.com/hotwire-lab/hotwire-core", tag = "v0.3.1" }
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "CanvasGradient",
  "CanvasRenderingContext2d",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "HtmlCanvasElement",
  "HtmlDivElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "MouseEvent",
  "Navigator",
  "Performance",
  "PointerEvent",
  "TextMetrics",
  "WheelEvent",
  "Window",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
